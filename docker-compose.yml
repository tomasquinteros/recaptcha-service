version: '3.8'

services:
  selenium-chrome:
    image: selenium/standalone-chrome:latest
    ports:
      - "4444:4444"
      - "7900:7900"  # VNC para ver la pantalla (opcional)
    environment:
      - SE_VNC_NO_PASSWORD=1
    volumes:
      - /dev/shm:/dev/shm
      - shared-downloads:/home/seluser/Downloads  # <--- acá montamos el volumen compartido
    shm_size: 2gb

  laravel:
    build: .
    ports:
      - "8001:80"
    volumes:
      - .:/var/www/html
      - shared-downloads:/var/www/html/public/downloads  # <--- Laravel accede acá
    depends_on:
      - selenium-chrome
    environment:
        - WWWUSER=1000
        - WWWGROUP=1000

volumes:
  shared-downloads:  # <--- definición del volumen
